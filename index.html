<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learning English</title>
<meta name="theme-color" content="#f0fdfa">
<link rel="icon" type="image/png" href="Thanh.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f0fdfa;--card:#fff;--tx:#0b3b38;--mu:#52807b;--pr:#0d9488;--ac:#f59e0b;--ok:#16a34a;--no:#e5484d;--bd:#c9eee8;--bt:#fff;color-scheme:light}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mu:#94a3b8;--pr:#38bdf8;--ac:#a78bfa;--ok:#34d399;--no:#fb7185;--bd:#334155;--bt:#06212e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px}
.top{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
h1{font-size:20px;margin:0}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--ac));transition:width .4s}
.sub{font-size:12px;color:var(--mu);margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--pr);color:var(--bt);border-color:var(--pr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:24px 18px;min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;box-shadow:0 6px 24px rgba(13,148,136,.15)}
.w{font-size:34px;font-weight:800;margin:0}
.ipa{color:var(--pr);font-size:18px;margin:6px 0}
.def{font-size:17px;line-height:1.5}
.hint{color:var(--mu);font-size:12px;margin-top:10px}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:12px;border-radius:12px;border:0;font-size:15px;font-weight:700;cursor:pointer;color:var(--bt);background:var(--pr)}
.btn.g{background:var(--ok)}.btn.r{background:var(--no)}.btn.l{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin-top:8px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;font-weight:600;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,var(--card))}
.q{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;font-size:17px;line-height:1.5}
input,textarea{width:100%;padding:11px;margin-top:8px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.list{margin-top:14px;font-size:14px}
.list div{padding:8px 0;border-bottom:1px solid var(--bd)}
.it b{display:block;font-size:16px}
.cn{font-size:12px;font-weight:600;margin-left:8px}
.it small{display:block;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details{margin-top:14px;font-size:14px}summary{cursor:pointer;font-weight:700}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--pr);color:var(--bt);padding:9px 16px;border-radius:99px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.s{opacity:1;top:calc(env(safe-area-inset-top,0px) + 24px)}
.combo{text-align:center;font-weight:800;color:#ff8a3d;min-height:24px;margin-bottom:6px}
.combo+.q{border:3px solid var(--pr);padding:20px 18px;margin-bottom:6px}
#os{margin-top:26px}
.combo+.q+input{margin-top:26px}
.li{display:flex;align-items:center;gap:10px}
.lt{display:block;flex:1;min-width:0}
.ip{color:var(--pr);font-size:13px;font-weight:500;margin-left:8px}
.lt small{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.4;margin-top:2px}
.lr{display:flex;align-items:center;flex:none}
.lr .cn{margin-left:6px}
.sp{width:34px;height:34px;margin-left:10px;padding:0;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;cursor:pointer}
.sp:active{background:var(--pr)}
.qq{display:flex;align-items:flex-start;gap:12px}
.qt{display:block;flex:1;min-width:0}
.qq .sp{flex:none;margin-left:0}
.subrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.subrow .sub{margin:0;flex:1;padding-top:4px}
.vw{position:relative;flex:none}
.vp{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer}
.vb{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:8;width:270px;max-width:calc(100vw - 32px);padding:14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.vb.open{display:block}
.vr{display:flex;align-items:center;gap:10px}
.vr+.vr{margin-top:14px}
.vr label{flex:none;width:52px;font-size:12px;color:var(--mu);font-weight:600}
.vb input{width:auto;flex:1;min-width:0;margin:0;padding:0;border:0;background:none;accent-color:var(--pr)}
#spv{flex:none;min-width:40px;text-align:right;font-weight:700;color:var(--pr)}
.seg{display:flex;flex:none;border:1px solid var(--bd);border-radius:99px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--tx);padding:5px 13px;font-size:12px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--pr);color:var(--bt)}
.vi{margin-left:8px;color:var(--tx);font-size:13px;font-weight:600}
.wl{display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:4px 12px}
.wl .vi{margin-left:0;font-size:22px;font-weight:600}
.vt{align-self:center;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;border-radius:50%;border:1.5px solid var(--pr);background:transparent;color:var(--pr);cursor:pointer;transition:background .15s,transform .15s}
.vt:hover{background:color-mix(in srgb,var(--pr) 14%,transparent)}
.vt:active{transform:scale(.92)}
.wl .vi.vsh{cursor:pointer;border-bottom:1.5px dashed var(--mu);animation:vfi .25s ease}
@keyframes vfi{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.cf{position:fixed;top:-30px;font-size:24px;pointer-events:none;z-index:10;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<main>
 <div class="top"><h1>📚 Learning English</h1><div><span class="chip" id="st">🔥 0</span> <span class="chip" id="lv">Lv 1</span> <span class="chip" id="xp">0 XP</span> <button class="chip" id="th" style="cursor:pointer;width:32px;height:32px;padding:0;border-radius:50%;font-size:16px;color:var(--tx)">☀️</button> <button class="chip" id="rs" title="Reset" style="cursor:pointer;width:32px;height:32px;padding:0;border-radius:50%;font-size:17px;color:var(--tx)">↺</button></div></div>
 <div class="bar"><i id="pb"></i></div>
 <div class="subrow"><div class="sub" id="ps"></div><div class="vw"><button class="vp" id="vp" title="Voice settings"></button><div class="vb" id="vb"><div class="vr"><label>Accent</label><div class="seg"><button data-a="en-GB" title="British English">UK</button><button data-a="en-US" title="American English">US</button></div></div><div class="vr"><label>Speed</label><input type="range" id="spd" min="0.5" max="1.2" step="0.05" title="Speaking speed"><span id="spv"></span></div></div></div></div>
 <div class="tabs"><button data-t="f">🃏 Cards</button><button data-t="q">🎯 Quiz</button><button data-t="a">📖 Word List</button></div>
 <div id="v"></div>
</main>
<div class="toast" id="to"></div>
<script>
const BASE=[["police","/pəˈliːs/","the official organization that is responsible for protecting people and property, making people obey the law, and catching people who have committed a crime"],["obey","/əʊˈbeɪ/","to act according to what you have been asked or ordered to do by someone in authority, or to behave according to a rule, law, or instruction"],["property","/ˈprɒp.ə.ti/","an object or objects that belong to someone"],["belong","/bɪˈlɒŋ/","to be in the right place or a suitable place"],["suitable","/ˈsjuː.tə.bəl/","acceptable or right for someone or something"],["crime","/kraɪm/","illegal activities"],["illegal","/ɪˈliː.ɡəl/","not allowed by law"],["allow","/əˈlaʊ/","to give permission for someone to do something, or to not prevent something from happening"],["permission","/pəˈmɪʃ.ən/","if someone is given this to do something, they are allowed to do it"],["prevent","/prɪˈvent/","to stop something from happening or someone from doing something"],["committed","/kəˈmɪt.ɪd/","loyal and willing to give your time and energy to something that you believe in"],["loyal","/ˈlɔɪ.əl/","firm and not changing in your friendship with or support for a person or an organization, or in your belief in your principles"],["firm","/fɜːm/","not soft but not completely hard"],["completely","/kəmˈpliːt.li/","in every way or as much as possible"],["principle","/ˈprɪn.sə.pəl/","a basic idea or rule that explains or controls how something happens or works"],["willing","/ˈwɪl.ɪŋ/","to be happy to do something if it is needed"],["restaurant","/ˈres.tər.ɒnt/","a place where meals are prepared and served to customers"],["meal","/mɪəl/","an occasion when food is eaten, or the food that is eaten on such an occasion"],["particular","/pəˈtɪk.jə.lər/","special, or this and not any other"],["occasion","/əˈkeɪ.ʒən/","a particular time, especially when something happens or has happened"],["beach","/biːtʃ/","an area of sand or small stones near the sea or another area of water such as a lake"],["sand","/sænd/","a substance that consists of very small grains of rock, found on beaches and in deserts"],["substance","/ˈsʌb.stəns/","material with particular physical characteristics"],["grain","/ɡreɪn/","a seed or seeds from a plant, especially a plant like a grass such as rice or wheat"],["seed","/siːd/","a small, round or oval object produced by a plant and from which, when it is planted, a new plant can grow"],["oval","/ˈəʊ.vəl/","shaped like a circle that is flattened so that it is like an egg or an ellipse"],["knife","/naɪf/","a tool, usually with a metal blade and a handle, used for cutting and spreading food or other substances, or as a weapon"],["metal","/ˈmet.əl/","a chemical element, such as iron or gold, or a mixture of such elements, such as steel, that is generally hard and strong"],["element","/ˈel.ɪ.mənt/","a part of something"],["blade","/bleɪd/","the flat part on a knife or similar tool or weapon, with a very thin edge used for cutting"],["spread","/spred/","to cover or reach a wider or increasing area, or to make something do this"],["weapon","/ˈwep.ən/","any object used in fighting or war, such as a gun, bomb, knife, etc."],["fork","/fɔːk/","a small object with three or four points and a handle, that you use to pick up food and eat with"],["spoon","/spuːn/","an object consisting of a round, hollow part and a handle, used for mixing, serving, and eating food"]];
let S={xp:0,streak:0,last:"",custom:[],m:{}};
try{const r=localStorage.getItem("ebs");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.custom=(S.custom||[]).map(x=>typeof x[3]==="boolean"?[x[0],x[1],x[2],"",x[3]]:x);
const vi=x=>x[3]||"";
const save=()=>{try{localStorage.setItem("ebs",JSON.stringify(S))}catch(e){}};
const B=()=>S.base||BASE;
const W=()=>B().concat(S.custom);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const day=()=>new Date().toISOString().slice(0,10);
let viOn=false,fc=null,tab="f",fi=0,flip=false,combo=0,cur=null,tt;
function toast(t){const e=$("to");e.textContent=t;e.classList.add("s");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("s"),1300)}
function gain(n,msg){
 const d=day();
 if(S.last!==d){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.last===y?S.streak+1:1;S.last=d;toast("🔥 "+S.streak+"-day streak!")}
 const l0=Math.floor(S.xp/100);S.xp+=n;
 if(Math.floor(S.xp/100)>l0)toast("🎉 Level up! Level "+(Math.floor(S.xp/100)+1)+"!");else if(msg)toast(msg);
 save();hud();
}
function hud(){
 $("st").textContent="🔥 "+S.streak;$("lv").textContent="Lv "+(Math.floor(S.xp/100)+1);$("xp").textContent=S.xp+" XP";
 const r=S.rd;let p=0,t="No round yet · Go to the 🎯 Quiz tab to start";
 if(r&&r.deck.length){p=r.i/r.deck.length*100;t=(r.ph===1?"Round 1 · Multiple choice":"Round 2 · Spelling")+(r.sub?" (review wrong words)":"")+": "+r.i+"/"+r.deck.length+" words"}
 $("pb").style.width=p+"%";$("ps").textContent=t;
}
function mkU(t){const u=new SpeechSynthesisUtterance(t),l=S.acc||"en-GB";u.lang=l;u.rate=S.rate||.85;try{const v=speechSynthesis.getVoices().find(x=>x.lang.replace("_","-")===l);if(v)u.voice=v}catch(e){}return u}
function speak(t){try{const u=mkU(t);speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
let qTok=0;
function qSpeak(btn,t){
 if(btn.dataset.on==="1"){qTok++;try{speechSynthesis.cancel()}catch(e){}btn.dataset.on="0";btn.textContent="🔊";return}
 try{
  speechSynthesis.cancel();
  const id=++qTok,u=mkU(t);
  const reset=()=>{if(id===qTok){btn.dataset.on="0";btn.textContent="🔊"}};
  u.onend=reset;u.onerror=reset;
  btn.dataset.on="1";btn.textContent="⏸️";
  speechSynthesis.speak(u);
 }catch(e){}
}
function mark(w,d){S.m[w]=Math.max(0,Math.min(5,(S.m[w]||0)+d));S.c=S.c||{};const c=S.c[w]=S.c[w]||[0,0];c[d>0?0:1]++}
const cnt=w=>{const c=(S.c||{})[w]||[0,0];return `<span class="cn" style="color:var(--ok)">✅${c[0]}</span><span class="cn" style="color:var(--no)">❌${c[1]}</span>`};
function pick(){ // favor weaker words
 const w=W(),ws=w.map(x=>6-(S.m[x[0]]||0)),t=ws.reduce((a,b)=>a+b,0);let r=Math.random()*t;
 for(let i=0;i<w.length;i++){r-=ws[i];if(r<=0)return w[i]}return w[0];
}
function render(){
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
 ({f:rFlash,q:rQuiz,a:rAdd})[tab]();
}
function nextCard(x){let n;do{n=pick()}while(n===x&&W().length>1);fc=n;viOn=false}
function rFlash(){
 const w=W();if(!fc||!w.includes(fc))fc=pick();const x=fc;
 $("v").innerHTML=`<div class="card" id="cd">${flip?`<p class="def">${esc(x[2])}</p><p class="hint">Tap to flip back</p>`:`<div class="wl"><p class="w">${esc(x[0])}</p>${vi(x)?(viOn?`<span class="vi vsh" id="vt" title="Tap to hide">${esc(vi(x))}</span>`:`<button class="vt" id="vt" title="Show Vietnamese meaning" aria-label="Show Vietnamese meaning"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>`):""}</div><p class="ipa">${esc(x[1])}</p><button class="btn l" id="sp" style="flex:none;padding:8px 16px">🔊 Listen</button><p class="hint">Tap the card to see the meaning</p>`}</div>
 <div class="row"><button class="btn r" id="hd">😵 Don't know</button><button class="btn g" id="ez">😎 Got it</button></div>
 <div class="hint" style="text-align:center">Random cards · ${fi} reviewed</div>`;
 $("cd").onclick=e=>{if(e.target.closest("#vt")){viOn=!viOn;rFlash();return}if(e.target.id==="sp"){speak(x[0]);return}flip=!flip;rFlash()};
 $("hd").onclick=()=>{mark(x[0],-1);gain(1);fi++;nextCard(x);flip=false;rFlash()};
 $("ez").onclick=()=>{mark(x[0],1);gain(5,"+5 XP");fi++;nextCard(x);flip=false;rFlash()};
}
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const byW=n=>W().find(x=>x[0]===n);
function newRound(ph,names){const d=shuf(names||W().map(x=>x[0]));S.rd={ph:ph,deck:d,n:d.length,i:0,ok:0,wr:[],sub:!!names};save();hud()}
function confetti(){for(let n=0;n<70;n++){const e=document.createElement("span");e.className="cf";e.textContent=["🎉","✨","🎊","⭐","💜"][n%5];e.style.left=Math.random()*100+"vw";e.style.animationDuration=(2+Math.random()*2)+"s";e.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),5500)}}
function answered(w,okk){const r=S.rd;r.i++;if(okk)r.ok++;else if(!r.wr.includes(w))r.wr.push(w);mark(w,okk?1:-1)}
function rQuiz(){
 if(!S.rd||!S.rd.deck.length)newRound(1);
 const r=S.rd;
 qTok++;try{speechSynthesis.cancel()}catch(e){}
 if(r.i>=r.deck.length)return rEnd();
 const x=byW(r.deck[r.i]);
 if(!x){r.deck.splice(r.i,1);if(r.n)r.n--;save();return rQuiz()}
 return r.ph===1?rPick(x):rType(x);
}
function nextBtn(r){return `<div class="row"><button class="btn" id="nb">${r.i>=r.deck.length?"See results ➜":"Next ➜"}</button></div>`}
function rPick(x){
 const r=S.rd,w=W();
 let o=[x];while(o.length<Math.min(4,w.length)){const c=w[Math.floor(Math.random()*w.length)];if(!o.some(z=>z[0]===c[0]))o.push(c)}
 o=shuf(o);
 $("v").innerHTML=`<div class="combo">${combo>1?"🔥 Combo x"+combo:""}</div><div class="q qq"><span class="qt">${esc(x[2])}</span><button class="sp" id="qs" title="Listen to the question">🔊</button></div><div id="os">${o.map(z=>`<button class="opt" data-w="${esc(z[0])}">${esc(z[0])}${z[1]?`<span class="ip">${esc(z[1])}</span>`:""}</button>`).join("")}</div><div id="nx"></div>`;
 $("qs").onclick=()=>qSpeak($("qs"),x[2]);
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  qTok++;try{speechSynthesis.cancel()}catch(e){}$("qs").dataset.on="0";$("qs").textContent="🔊";
  document.querySelectorAll(".opt").forEach(z=>{z.disabled=true;if(z.dataset.w===x[0])z.classList.add("ok")});
  const okk=b.dataset.w===x[0];
  answered(x[0],okk);
  if(okk){combo++;speak(x[0]);const g=10+Math.min(combo,5)*2;gain(g,["Correct! ","Awesome! ","Nailed it! "][combo%3]+"+"+g+" XP")}
  else{b.classList.add("no");combo=0;save();hud();toast("Not quite — we'll review it at the end 💪")}
  $("nx").innerHTML=nextBtn(r);$("nb").onclick=rQuiz;
 });
}
function rType(x){
 const r=S.rd;
 $("v").innerHTML=`<div class="combo">${combo>1?"🔥 Combo x"+combo:""}</div><div class="q qq"><span class="qt">${esc(x[2])}<span class="hint" style="display:block">${x[0].length} letters</span></span><button class="sp" id="qs" title="Listen to the question">🔊</button></div><input id="ty" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type the English word…"><div class="row"><button class="btn l" id="hr" style="flex:none;padding:12px 16px">🔊</button><button class="btn" id="ck">Check</button></div><div id="nx"></div>`;
 const inp=$("ty");inp.focus();
 $("qs").onclick=()=>qSpeak($("qs"),x[2]);
 $("hr").onclick=()=>speak(x[0]);
 let done=false;
 const check=()=>{
  if(done)return;
  const v=inp.value.trim().toLowerCase();if(!v){toast("Type a word first");return}
  done=true;inp.disabled=true;$("ck").disabled=true;qTok++;try{speechSynthesis.cancel()}catch(e){}$("qs").dataset.on="0";$("qs").textContent="🔊";
  const okk=v===x[0].toLowerCase();
  answered(x[0],okk);
  if(okk){combo++;inp.style.borderColor="var(--ok)";const g=15+Math.min(combo,5)*2;gain(g,"Correct! +"+g+" XP")}
  else{combo=0;inp.style.borderColor="var(--no)";save();hud()}
  $("nx").innerHTML=`<div class="q" style="margin-top:10px">${okk?"✅ Correct!":"❌ Correct answer: <b>"+esc(x[0])+"</b> "+esc(x[1])}</div>`+nextBtn(r);
  $("nb").onclick=rQuiz;$("nb").focus();
 };
 $("ck").onclick=check;
 inp.onkeydown=e=>{if(e.key==="Enter")check()};
}
function rEnd(){
 const r=S.rd,n=r.deck.length,w=r.wr;
 const lst=w.map(k=>{const z=byW(k);return z?`<div class="it"><b>${esc(z[0])}${cnt(z[0])}</b><small>${esc(z[2])}</small></div>`:""}).join("");
 if(r.ph===1){
  const pf=!w.length;
  $("v").innerHTML=`<div class="q" style="text-align:center"><div style="font-size:40px">${pf?"🎯":"📝"}</div><b>${r.sub?"Review of wrong words done!":"Round 1 complete!"}</b><br>${r.ok}/${n} correct.</div>${pf?"":`<div class="list"><b>Wrong words (${w.length})</b>${lst}</div>`}<div class="row">${pf?"":`<button class="btn" id="rt">🔁 Review wrong words</button>`}<button class="btn${pf?"":" l"}" id="go">✍️ Go to Round 2 (spelling)</button></div>`;
  const rt=$("rt");if(rt)rt.onclick=()=>{newRound(1,w.slice());rQuiz()};
  $("go").onclick=()=>{newRound(2);rQuiz()};
 }else if(!w.length){
  if(!r.cel){r.cel=1;save();confetti();gain(r.sub?20:50,"🏆 Perfect! +"+(r.sub?20:50)+" XP")}
  $("v").innerHTML=`<div class="q" style="text-align:center"><div style="font-size:52px">🏆</div><b>${r.sub?"You fixed all the wrong words!":"Amazing! "+n+"/"+n+" spelled correctly!"}</b><br>${r.sub?"Start a new round to keep practicing.":"You've conquered the whole list."}</div><div class="row"><button class="btn" id="go">🔁 New round</button></div>`;
  $("go").onclick=()=>{newRound(1);rQuiz()};
 }else{
  $("v").innerHTML=`<div class="q" style="text-align:center"><div style="font-size:40px">✍️</div><b>Round 2 complete!</b><br>${r.ok}/${n} correct.</div><div class="list"><b>Misspelled words (${w.length})</b>${lst}</div><div class="row"><button class="btn" id="rt">🔁 Review wrong words</button><button class="btn l" id="go">🏁 New round</button></div>`;
  $("rt").onclick=()=>{newRound(2,w.slice());rQuiz()};
  $("go").onclick=()=>{newRound(1);rQuiz()};
 }
}
function rAdd(){
 const P=S.custom.filter(x=>!x[4]),L=S.custom.filter(x=>x[4]).reverse().concat(B());
 $("v").innerHTML=`<details open><summary>📖 Word List (${L.length})</summary><div class="list">${L.map(x=>`<div class="it li"><span class="lt"><b>${esc(x[0])}${x[1]?`<span class="ip">${esc(x[1])}</span>`:""}${vi(x)?`<span class="vi">${esc(vi(x))}</span>`:""}</b><small>${esc(x[2])}</small></span><span class="lr">${cnt(x[0])}<button class="sp" data-w="${esc(x[0])}" title="Listen">🔊</button></span></div>`).join("")}</div></details>
 <details${P.length?" open":""}><summary>➕ Add new words${P.length?" ("+P.length+" waiting to paste)":""}</summary>
 <div class="q" style="margin-top:8px">Add a new word (+15 XP each)
 <input id="nw" placeholder="Word (e.g. obey)"><input id="ni" placeholder="Pronunciation (e.g. /əʊˈbeɪ/)"><textarea id="nd" rows="3" placeholder="English definition"></textarea><input id="nv" placeholder="Vietnamese meaning (e.g. tuân thủ)"></div>
 <div class="row"><button class="btn" id="ad">➕ Add word</button></div>
 <div class="list">${P.length?`<b>✨ New words waiting to paste into the Sheet (${P.length})</b>${P.slice().reverse().map(x=>`<div class="it"><b>${esc(x[0])}</b><small>${esc(x[2])}</small></div>`).join("")}<div class="row"><button class="btn l" id="cp">📋 1. Copy</button><button class="btn g" id="ok">✅ 2. Pasted into Sheet</button></div>`:`<span style="color:var(--mu)">No new words waiting. Add one!</span>`}</div></details>
 <details><summary>🔄 Sync from Sheet</summary><div class="q" style="font-size:14px;margin-top:8px">In the Sheet, select columns A:D, press Ctrl+C, then paste below. The app will match its word list to the Sheet; any new word not yet in the Sheet goes back to the waiting list.<textarea id="sy" rows="4"></textarea><div class="row"><button class="btn" id="sb">🔄 Sync</button></div></div></details>`;
 document.querySelectorAll(".sp").forEach(b=>b.onclick=()=>speak(b.dataset.w));
 $("ad").onclick=()=>{
  const a=$("nw").value.trim(),b=$("ni").value.trim(),c=$("nd").value.trim(),d=$("nv").value.trim();
  if(!a||!c){toast("Enter a word and its definition");return}
  if(W().some(x=>x[0].toLowerCase()===a.toLowerCase())&&!confirm("This word already exists. Add anyway?"))return;
  S.custom.push([a,b,c,d,false]);gain(15,"🎉 Added \""+a+"\" +15 XP");speak(a);rAdd();
 };
 const ok=$("ok");if(ok)ok.onclick=()=>{S.custom.forEach(x=>{x[4]=true});save();toast("✅ Moved to the Word List");rAdd()};
 $("sb").onclick=()=>{const rows=$("sy").value.split("\n").map(l=>l.split("\t")).filter(r=>r[0]&&r[0].trim()&&r[2]).map(r=>[r[0].trim(),(r[1]||"").trim(),r[2].trim().replace(/:$/,""),(r[3]||"").trim()]);
  if(!rows.length){toast("No Sheet data received");return}
  const have=new Set(rows.map(r=>r[0].toLowerCase()));
  S.base=rows;S.custom=S.custom.filter(x=>!have.has(x[0].toLowerCase())).map(x=>[x[0],x[1],x[2],x[3]||"",false]);
  save();hud();toast("🔄 Synced "+rows.length+" words");rAdd()};
 const cp=$("cp");if(cp)cp.onclick=()=>{
  const t=P.map(x=>x.slice(0,4).join("\t")).join("\n");
  const done=()=>{P.forEach(x=>x[4]=true);save();toast("Copied! Words moved to the Word List");rAdd()};
  try{navigator.clipboard.writeText(t).then(()=>toast("Copied! Paste into the Sheet, then tap ✅"),()=>prompt("Copy:",t))}catch(e){prompt("Copy:",t)}
 };
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
$("rs").onclick=()=>{if(!confirm("Reset Level, XP, round progress and correct/wrong counts? (Your word list is kept.)"))return;S.xp=0;S.m={};S.c={};S.rd=null;combo=0;save();hud();render();toast("Reset done ↺")};
function applyTheme(t){
 document.documentElement.dataset.theme=t;
 $("th").textContent=t==="dark"?"🌙":"☀️";
 $("th").title=t==="dark"?"Switch to light mode":"Switch to dark mode";
 const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="dark"?"#0f172a":"#f0fdfa";
}
$("th").onclick=()=>{S.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";save();applyTheme(S.theme)};
applyTheme(S.theme||((window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"));
let vOpen=false;
function voiceUI(){
 document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.a===(S.acc||"en-GB")));
 const r=+(S.rate||.85);$("spd").value=r;$("spv").textContent=r.toFixed(2)+"×";
 $("vp").textContent="🔊 "+((S.acc||"en-GB")==="en-US"?"US":"UK")+(vOpen?" ▴":" ▾");
}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.acc=b.dataset.a;save();voiceUI();speak("Hello, let's learn English")});
$("spd").oninput=()=>{S.rate=+$("spd").value;$("spv").textContent=S.rate.toFixed(2)+"×"};
$("spd").onchange=()=>{save();speak("Hello, let's learn English")};
try{speechSynthesis.getVoices()}catch(e){}
function setV(o){vOpen=o;$("vb").classList.toggle("open",o);voiceUI()}
$("vp").onclick=()=>setV(!vOpen);
document.addEventListener("pointerdown",e=>{if(vOpen&&!e.target.closest(".vw"))setV(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&vOpen)setV(false)});
voiceUI();
hud();render();
</script>
</body>
</html>
