<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learning English</title>
<meta name="theme-color" content="#f0fdfa">
<link rel="icon" type="image/png" href="Thanh.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f0fdfa;--card:#fff;--tx:#0b3b38;--mu:#52807b;--pr:#0d9488;--ac:#f59e0b;--ok:#16a34a;--no:#e5484d;--bd:#c9eee8;--bt:#fff;--wt:#dc2626;--h1:#f97316;--h2:#eab308;color-scheme:light}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mu:#94a3b8;--pr:#38bdf8;--ac:#a78bfa;--ok:#34d399;--no:#fb7185;--bd:#334155;--bt:#06212e;--wt:#f43f5e;--h1:#fb923c;--h2:#fde047;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px}
.top{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;position:relative;margin-bottom:10px}
.chips{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
@media (max-width:390px){.chip{padding:4px 7px;font-size:12px}.chips{gap:4px}}
#qp .bar{margin:0;flex:1}
.qr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
h1{font-size:20px;margin:0}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:5px 9px;white-space:nowrap;font-size:13px;font-weight:600}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--ac));transition:width .4s}
.sub{font-size:12px;color:var(--mu);margin-bottom:12px}
.btn.rb{flex:none;width:auto;padding:6px 12px;font-size:15px;white-space:nowrap}
.qh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.qh>:first-child{justify-self:start}.qh>:last-child{justify-self:end}.qh b{text-align:center}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--pr);color:var(--bt);border-color:var(--pr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:px;padding:24px 18px;min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;box-shadow:0 6px 24px rgba(13,148,136,.15)}
.w{font-size:34px;font-weight:800;margin:0}
.ipa{color:var(--pr);font-size:18px;margin:6px 0}
.def{font-size:17px;line-height:1.5}
.hint{color:var(--mu);font-size:12px;margin-top:10px}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:12px;border-radius:12px;border:0;font-size:15px;font-weight:700;cursor:pointer;color:var(--bt);background:var(--pr)}
.btn.g{background:var(--ok)}.btn.r{background:var(--no)}.btn.l{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin-top:8px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;font-weight:600;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,var(--card))}
.q{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;font-size:17px;line-height:1.5}
input,textarea{width:100%;padding:11px;margin-top:8px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.list{margin-top:14px;font-size:14px}
.list div{padding:8px 0;border-bottom:1px solid var(--bd)}
.it b{display:block;font-size:16px}
.cn{font-size:12px;font-weight:600;margin-left:8px}
.it small{display:block;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details{margin-top:18px;font-size:14px}summary{cursor:pointer;font-weight:700;font-size:16px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--pr);color:var(--bt);padding:9px 16px;border-radius:99px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.s{opacity:1;top:calc(env(safe-area-inset-top,0px) + 24px)}
.toast.sd{transform:none;white-space:normal;max-width:calc(50vw - 22px);height:40px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;line-height:1.3;padding:0 12px;border-radius:14px;top:calc(env(safe-area-inset-top,0px) + 44px);transition:opacity .2s}
.toast.sd.s{top:calc(env(safe-area-inset-top,0px) + 44px)}
#tl{left:max(12px,env(safe-area-inset-left,0px))}
#tr{left:auto;right:max(12px,env(safe-area-inset-right,0px));opacity:0}
#tr.s{opacity:.95}
.combo{text-align:center;font-weight:800;color:#ff8a3d;min-height:24px;margin-bottom:6px}
.combo+.q{border:3px solid var(--pr);padding:px 18px;margin-bottom:6px}
#os{margin-top:26px}
.combo+.q+input{margin-top:26px}
.li{display:flex;align-items:center;gap:10px}
.lt{display:block;flex:1;min-width:0}
.ip{color:var(--pr);font-size:13px;font-weight:500;margin-left:8px}
.lt small{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.4;margin-top:2px}
.lt small.vd{color:var(--tx);font-weight:600;opacity:.95}
.dv{display:block;margin-top:10px;font-size:16px;font-weight:600;color:var(--pr)}
.lr{display:flex;align-items:center;flex:none}
.lr .cn{margin-left:6px}
.sp{width:34px;height:34px;margin-left:10px;padding:0;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;cursor:pointer}
.sp:active{background:var(--pr)}
.qq{display:flex;align-items:flex-start;gap:12px}
.qt{display:block;flex:1;min-width:0}
.qq .sp{flex:none;margin-left:0}
.subrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.subrow .sub{margin:0;flex:1;padding-top:4px}
.vw{position:static;flex:none}
.vp{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:5px 9px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.vb{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:8;width:270px;max-width:calc(100vw - 32px);padding:14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.vb.open{display:block}
.vr{display:flex;align-items:center;gap:10px}
.vr+.vr{margin-top:14px}
.vr label{flex:none;width:52px;font-size:12px;color:var(--mu);font-weight:600}
.vb input{width:auto;flex:1;min-width:0;margin:0;padding:0;border:0;background:none;accent-color:var(--pr)}
#spv{flex:none;min-width:40px;text-align:right;font-weight:700;color:var(--pr)}
.seg{display:flex;flex:none;border:1px solid var(--bd);border-radius:99px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--tx);padding:5px 13px;font-size:12px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--pr);color:var(--bt)}
.vi{margin-left:8px;color:var(--tx);font-size:13px;font-weight:600}
.wl{display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:4px 12px}
.wl .vi{margin-left:0;font-size:22px;font-weight:600}
.vt{align-self:center;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;padding:0;border-radius:50%;border:1.5px solid var(--pr);background:transparent;color:var(--pr);cursor:pointer;transition:background .15s,transform .15s}
.vt svg{width:11px;height:11px}
.vt:hover{background:color-mix(in srgb,var(--pr) 14%,transparent)}
.vt:active{transform:scale(.92)}
.wl .vi.vsh{cursor:pointer;border-bottom:1.5px dashed var(--mu);animation:vfi .25s ease}
@keyframes vfi{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.gh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.gc{display:flex;gap:14px;align-items:center;padding:14px;margin-bottom:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;cursor:pointer;transition:transform .12s}
.gc:active{transform:scale(.98)}
.ge{font-size:38px;flex:none}
.gi{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mu);line-height:1.35}
.gi b{font-size:16px;color:var(--tx)}
.gi em{font-style:normal;font-size:12px;color:var(--pr);font-weight:700}
.ga{position:relative;height:340px;overflow:hidden;border-radius:16px;border:1px solid var(--bd);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.sky{background:linear-gradient(color-mix(in srgb,var(--pr) 26%,var(--card)),var(--card))}
.gp{position:absolute;top:8px;left:8px;right:8px;z-index:3;display:flex;gap:8px;align-items:flex-start;background:var(--card);border:2px solid var(--pr);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.35}
.gp .sp{margin-left:0;flex:none}
.bl{position:absolute;bottom:-130px;width:92px;cursor:pointer;will-change:transform;touch-action:manipulation}
.bl::after{content:"";display:block;width:2px;height:16px;margin:0 auto;background:rgba(0,0,0,.35)}
.bb{width:92px;height:112px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-weight:800;font-size:13px;padding:6px;box-shadow:inset -8px -10px 0 rgba(0,0,0,.14);word-break:break-word}
.spk{position:absolute;left:0;top:70px;width:100%;height:16px;z-index:2;pointer-events:none}
.spk.fx{animation:spkf .35s}
@keyframes spkf{50%{filter:drop-shadow(0 0 6px #ef4444) brightness(1.5)}}
.pt{position:absolute;width:7px;height:7px;margin:-3px 0 0 -3px;border-radius:50%;z-index:2;pointer-events:none;animation:ptb .65s ease-out forwards}
@keyframes ptb{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.bx{position:absolute;z-index:2;font-size:28px;pointer-events:none;animation:bxa .45s ease-out forwards}
@keyframes bxa{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
.bb.pop{animation:bpop .25s forwards;pointer-events:none}
.bb.bad{filter:grayscale(1)}
@keyframes bpop{50%{transform:scale(1.25)}to{transform:scale(.2);opacity:0}}
.spc{background:radial-gradient(1px 1px at px 30px,#fff,transparent),radial-gradient(1px 1px at 70px 80px,#fff,transparent),radial-gradient(circle at 25% %,#1d2a5c,#0a0f24);background-size:100px 100px,130px 130px,100% 100%;border-color:#1e293b}
.en{position:absolute;top:0;left:0;width:50%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 4px;will-change:transform}
.en .eb{font-size:30px;line-height:1.1}
.en .ec{background:rgba(255,255,255,.93);color:#0b10;border-radius:10px;padding:4px 8px;font-size:12px;font-weight:700;line-height:1.25}
.en .ec small{display:block;font-weight:500;color:#475569;font-size:10px;margin-top:1px}
.spd>span{flex:none;margin-right:8px}
.spd .rt{display:flex;align-items:center;gap:6px;min-width:0}
.spd .seg button{padding:5px 9px}
.lg{padding:5px 10px!important}
.lg{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.lg.on{background:var(--pr);color:var(--bt);border-color:var(--pr)}
.spd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:12px;color:var(--mu);font-weight:600}
.rk{position:absolute;left:50%;bottom:6px;margin-left:-17px;font-size:30px;line-height:1.15;z-index:2;transform:rotate(-45deg);transform-origin:50% 55%;transition:transform .25s ease-out;pointer-events:none}
.bm{position:absolute;width:3px;margin:0;border-radius:2px;background:linear-gradient(to top,rgba(253,224,71,.15),#fde047);transform-origin:50% 100%;z-index:1;pointer-events:none;animation:bmf .3s ease-out forwards}
@keyframes bmf{from{opacity:1}to{opacity:0}}
.gnd{position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(transparent,rgba(56,189,248,.28));border-top:2px dashed rgba(255,255,255,.35);text-align:center;font-size:26px;padding-top:6px}
#gt{margin-top:10px}
body.gfocus .top,body.gfocus .tabs,body.gfocus #ga .hint{display:none}
.gg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;position:relative}
.pl{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--tx);font:inherit;min-width:0}
.pl i{font-style:normal;font-size:26px;line-height:1.15}
.pl span{font-size:10.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;padding:0 2px}
.pl.full{border-color:var(--ok)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;font-size:12px;white-space:nowrap}
.tabs button span{font-size:17px;line-height:1.2}
.cf{position:fixed;top:-30px;font-size:24px;pointer-events:none;z-index:10;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.pl i{display:block;line-height:0}
.pl svg{width:60px;height:78px;overflow:visible}
.q svg{width:76px;height:99px;vertical-align:middle;overflow:visible}
.q.pb svg{width:140px;height:182px}
.sw{transform-origin:50px 80px;animation:swy 3.6s ease-in-out infinite}
@keyframes swy{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.lv{transform-box:fill-box;transform-origin:50% 100%;animation:lvy 2.4s ease-in-out infinite}
@keyframes lvy{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.fl{transform-box:fill-box;transform-origin:center;animation:fly 2.2s ease-in-out infinite}
@keyframes fly{0%,100%{transform:scale(.88) rotate(-8deg)}50%{transform:scale(1.15) rotate(8deg)}}
.fr{animation:fry 2.4s ease-in-out infinite}
@keyframes fry{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
.tw{transform-box:fill-box;transform-origin:center;animation:twy 1.8s ease-in-out infinite}
@keyframes twy{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.08);filter:brightness(1.25)}}
.sk{transform-box:fill-box;transform-origin:center;animation:skt 1.8s ease-in-out infinite}
@keyframes skt{0%,100%{transform:scale(.2) rotate(0);opacity:0}50%{transform:scale(1.15) rotate(45deg);opacity:1}}
.dr{transform-origin:50px 80px;transform:rotate(9deg);animation:drs 4.2s ease-in-out infinite}
@keyframes drs{0%,100%{transform:rotate(7deg)}50%{transform:rotate(11.5deg)}}
.lwr{transform-box:fill-box;transform-origin:50% 100%;transform:rotate(42deg) scaleY(.75);animation:lwry 3.4s ease-in-out infinite}
@keyframes lwry{0%,100%{transform:rotate(38deg) scaleY(.76)}50%{transform:rotate(47deg) scaleY(.72)}}
.lwl{transform-box:fill-box;transform-origin:50% 100%;transform:rotate(-42deg) scaleY(.75);animation:lwly 3.4s ease-in-out infinite}
@keyframes lwly{0%,100%{transform:rotate(-38deg) scaleY(.76)}50%{transform:rotate(-47deg) scaleY(.72)}}
.wd{transform:translateY(5px);animation:wdy 3s ease-in-out infinite}
@keyframes wdy{0%,100%{transform:translateY(5px)}50%{transform:translateY(7px)}}
.th{animation:thp 1.4s ease-in-out infinite}
@keyframes thp{0%,100%{opacity:.3}50%{opacity:1}}
.pp{display:block;font-size:8px;letter-spacing:1px;color:var(--ok);line-height:1;margin-top:2px}
.st{animation:stk 2s ease-in-out infinite}
@keyframes stk{0%{opacity:0;transform:translateY(4px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-6px)}}
.pl.wt{border:1px solid var(--wt);padding:8px 2px}
.pl.wt .pp{color:var(--wt)}
.q.pb{position:relative}
.pbt{position:absolute;top:10px;left:10px;z-index:2;background:var(--pr);color:var(--bt);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:700;line-height:1.3;pointer-events:none;animation:pbt 1.8s ease forwards}
@keyframes pbt{0%{opacity:0;transform:translateY(-6px)}12%,75%{opacity:1;transform:none}100%{opacity:0}}
.au{position:fixed;inset:0;z-index:;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.au.off{display:none}
.aub{width:100%;max-width:340px;background:var(--card);border:1px solid var(--bd);border-radius:px;padding:22px 18px;text-align:center}
.aub h2{margin:0 0 10px;font-size:px}
.aub .btn{width:100%;margin-top:12px}
.aub .btn:disabled{opacity:.6}
.cur{display:flex;gap:5px;align-items:center}
.btn.l.on{background:var(--pr);color:var(--bt);border-color:var(--pr)}
.btn:disabled{opacity:.5;cursor:default}
.gact .btn{padding:10px 6px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.gact svg{width:17px;height:17px}
.pl.rp{border-color:var(--h1);box-shadow:0 0 0 2px color-mix(in srgb,var(--h1) 35%,transparent);animation:rpg 1.6s ease-in-out infinite}
@keyframes rpg{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--h1) 12%,transparent)}}
.gg.hm .pl:not(.rp){opacity:.5}
.cfly{position:fixed;transform:translateX(-50%);font-weight:800;font-size:16px;color:#d97706;z-index:30;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.25);animation:cfy 1s ease-out forwards}
@keyframes cfy{to{transform:translate(-50%,-50px);opacity:0}}
.shi{display:flex;gap:12px;align-items:center;padding:12px;margin-bottom:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px}
.shi .btn{flex:none;padding:8px 12px;font-size:14px;min-width:78px}
.bfs{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:2}
.bf{position:absolute;left:0;top:0;width:24px;height:24px;will-change:transform}
.bf .bi{width:100%;height:100%;transition:transform .7s}
.bf svg{width:100%;height:100%;display:block;overflow:visible}
.bf .bw{transform-origin:12px 12px;animation:bflap .16s ease-in-out infinite alternate}
.bf.rest .bw{animation-duration:1.2s}
.bf.fly svg{animation:bbob .45s ease-in-out infinite alternate}
@keyframes bflap{to{transform:scaleX(.2)}}
@keyframes bbob{to{transform:translateY(-4px)}}
.chip.rl{cursor:pointer;color:var(--tx);font-family:inherit}
.rlb{margin-bottom:10px;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;font-size:12px;line-height:1.5;color:var(--mu)}
.bf.bee .bw{animation-duration:.07s}
.bf.bee.rest .bw{animation-duration:.5s}
.bf.bee.fly svg{animation-duration:.18s}
.gg.still .pl svg *{animation:none!important}
.gg.potv .pl svg{height:74px}
.potv .q svg,.q.pb.potv svg{height:auto}
.q.pb.potv svg{height:170px}
.bk{transform-box:fill-box;transform-origin:center;animation:bkk 4s ease-in-out infinite}
@keyframes bkk{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.shelf{margin-bottom:px}
.sh-t{font-size:13px;font-weight:800;color:var(--mu);margin:0 0 6px 4px}
.sh-r{display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding:4px 6px 0;border-bottom:10px solid #a8692f;border-radius:0 0 6px 6px;box-shadow:0 7px 8px -5px rgba(0,0,0,.3),inset 0 -2px 0 rgba(255,255,255,.18);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sh-r::-webkit-scrollbar{display:none}
.si{flex:none;width:calc((100% - 18px)/4);min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:8px 4px;background:var(--card);border:1px solid var(--bd);border-bottom:0;border-radius:10px 10px 0 0}
.si .se{font-size:28px;line-height:1.1}
.si b{font-size:11.5px;line-height:1.2}
.si .sd{font-size:10px;line-height:1.3;color:var(--mu)}
.si em{font-style:normal;font-size:10px;color:var(--pr);font-weight:700}

 // trả về {t:"go",n:ô kế,rem} | {t:"wait"} (chờ con kia tới) | {t:"done"} (ngủ) ; rem = số ô còn phải làm
 function plan(){
  const a=seq(),N=a.length,m=me(),o=ot();
  if(!N)return{t:"done",rem:0};
  m.p=Math.max(0,Math.min(N-1,m.p));if(o)o.p=Math.max(0,Math.min(N-1,o.p));
  const P0=DBP[0],P1=DBP[1];
  if(o&&P0.d>0&&P1.d<0&&P0.p<P1.p){                               // đang đi vào gặp nhau
   const e=dbMeet(P0.p,P1.p),goal=i===0?e:e+1;
   if(m.p===goal){
    if(o.p!==(i===0?goal+1:goal-1))return{t:"wait",rem:0};         // mình tới rồi, chờ con kia
    if(i===0?anyUnv(a,0,m.p-1):anyUnv(a,m.p+1,N-1)){m.d=-m.d;return plan()} // còn ô mới ngoài phạm vi (do thêm từ): quét nốt
    return{t:"done",rem:0};
   }
   return{t:"go",n:m.p+m.d,rem:cntTo(a,m.p,goal)};
  }
  // quét thẳng: 1 con, hoặc 2 con đang đi ra xa nhau
  const behind=m.d>0?anyUnv(a,0,m.p-1):anyUnv(a,m.p+1,N-1);
  if(o&&o.d===m.d&&(o.p-m.p)*m.d>0){                              // con kia đi trước cùng chiều: nhường
   if(behind){m.d=-m.d;return plan()}
   return{t:"done",rem:0};
  }
  let ahead=0;for(let k=m.p+m.d;k>=0&&k<N;k+=m.d)if(unv(a,k))ahead++;
  if(!ahead){if(!o&&behind){m.d=-m.d;return plan()}return{t:"done",rem:0}}
  const n=m.p+m.d;
  if(o&&o.p===n)return{t:"done",rem:ahead};
  return{t:"go",n,rem:ahead};
 }

 // tư thế lăn: góc nghiêng theo cỡ bóng (8° → 55°), chân sau luôn chạm mặt bóng
 const dpose=R=>{
  const K=.9,f=Math.max(0,Math.min(1,(R-3)/22)),deg=8+47*f,a=deg*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
  const py=25.5-K*Math.max(.6*s+9.8*c,10.2*s+9.2*c);          // hạ thân cho chân trước chạm đất
  const T=(x,y)=>[15+K*(x*c-y*s),py+K*(x*s+y*c)];
  bodyG.setAttribute("transform",`translate(15 ${py.toFixed(2)}) rotate(${deg.toFixed(1)}) scale(${K})`);
  const C=[4-R,26-R],l=5.2;                                     // tâm bóng (toạ độ SVG bọ) · độ dài mỗi đoạn chân
  const leg=(sx,sy,offs)=>{
   const S=T(sx,sy),b=Math.atan2(S[1]-C[1],S[0]-C[0]);
   let P=[C[0]+R*Math.cos(b),C[1]+R*Math.sin(b)];               // điểm gần vai nhất trên mặt bóng
   for(const o of offs){const q=[C[0]+R*Math.cos(b+o),C[1]+R*Math.sin(b+o)];if(Math.hypot(q[0]-S[0],q[1]-S[1])<=9.6){P=q;break}}
   const ex=P[0]-S[0],ey=P[1]-S[1],d=Math.hypot(ex,ey)||1,dd=Math.min(d,2*l-.01),h=Math.sqrt(Math.max(0,l*l-dd*dd/4));
   let nx=-ey/d,ny=ex/d;if(ny>0){nx=-nx;ny=-ny}                  // đầu gối luôn hướng lên
   const Kn=[(S[0]+P[0])/2+nx*h,(S[1]+P[1])/2+ny*h];
   return `<path d="M${S[0].toFixed(2)} ${S[1].toFixed(2)}L${Kn[0].toFixed(2)} ${Kn[1].toFixed(2)}L${P[0].toFixed(2)} ${P[1].toFixed(2)}"/>`;
  };
  legG.innerHTML=leg(-5,3.6,[-.35,-.2,0])+leg(-3,4.2,[.2,.1,0]);
 };
